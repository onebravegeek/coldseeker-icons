# Every picture in this repository, into the bucket the wallet reads from.
#
# The upload does not go to R2 directly. It goes through ColdSeeker's own worker, at
# PUT /manual/<address>, guarded by a secret this repository holds and that worker
# holds and nothing else does. Two reasons, both worth keeping: minting an R2 token
# needs a browser and a person, and a token that can write to a bucket is a wider thing
# to hand a CI runner than a key that can write one prefix through one endpoint that
# checks what it is being handed.
name: Into the bucket

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two pushes uploading the same address in two orders is a picture nobody chose.
  group: upload
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # Branch protection and deployment environments both want GitHub Pro on a private
      # repository, and this one is private, so the gate is here instead. It is a real
      # gate for the path it covers — a pull request merged without a review from
      # somebody other than its author uploads nothing — and it is honestly weaker than
      # the platform's: anybody who can push straight to main goes around it. Keep that
      # in mind when handing out write access, or make the repository public, where the
      # platform's own protection costs nothing. Nothing in here is secret: every
      # picture is already served to everyone at /of/<address>.
      - name: Was this looked at by somebody other than whoever wrote it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null || echo '')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "This commit did not arrive through a pull request, so nobody reviewed it."
            echo "Open one. If that is not possible, upload by hand — the command is in"
            echo "the ColdSeeker repository, proxy/README.md — and say in the commit why."
            exit 1
          fi

          author=$(gh api "repos/$REPO/pulls/$pr" --jq '.user.login')
          approvers=$(gh api "repos/$REPO/pulls/$pr/reviews" --jq '[.[] | select(.state == "APPROVED") | .user.login] | unique | .[]' || true)

          others=$(printf '%s\n' "$approvers" | grep -v "^${author}$" | grep -v '^$' || true)
          if [ -z "$others" ]; then
            echo "Pull request #$pr was opened by $author and approved by nobody else."
            echo "A picture here is this project telling somebody, on the screen where they"
            echo "decide whether to sign, that it belongs to that address. One other pair of"
            echo "eyes is the whole cost of saying that."
            exit 1
          fi

          echo "Pull request #$pr, approved by: $(printf '%s ' $others)"

      - uses: actions/checkout@v4
        with:
          # The previous commit as well, so the diff below has something to compare
          # against. A shallow clone makes every push look like the first one.
          fetch-depth: 2

      - name: Send what changed
        env:
          KEY: ${{ secrets.ICONS_KEY }}
          WORKER: https://coldseeker-rpc.mediakov.workers.dev
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${KEY:-}" ]; then
            echo "ICONS_KEY is not set on this repository. Nothing can be uploaded."
            exit 1
          fi

          # What this push changed under tokens/ and programs/, and nothing else. A
          # README edit uploads no pictures.
          before="${{ github.event.before }}"
          case "$before" in
            ""|0000000000000000000000000000000000000000) range="HEAD" ;;
            *) range="$before HEAD" ;;
          esac

          changed=$(git diff --name-status $range -- tokens programs || git ls-files tokens programs | sed 's/^/A\t/')

          if [ -z "$changed" ]; then
            echo "No picture changed in this push."
            exit 0
          fi

          fail=0
          while IFS=$'\t' read -r status path rest; do
            [ -n "${path:-}" ] || continue
            address=$(basename "$path" | sed 's/\.[^.]*$//')

            case "$status" in
              D)
                echo "delete $address"
                code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE \
                  -H "authorization: Bearer $KEY" \
                  "$WORKER/manual/$address")
                ;;
              A|M|R*|C*)
                # Where these bytes came from. The worker stores it beside the picture,
                # and it is the only answer anybody gets later to "who put this here".
                # One line, and indented like everything else in this block: a line
                # with less indentation than the block ends it, and YAML then reads the
                # rest of the script as keys. That is what "workflow file issue" meant.
                source=$(python3 -c 'import json,sys; print(json.load(open("sources.json")).get(sys.argv[1], ""))' "$address" 2>/dev/null || echo '')
                if [ -z "$source" ]; then
                  echo "  $address has no line in sources.json — refusing to upload a picture nobody can trace"
                  fail=1
                  continue
                fi
                echo "upload $address ($(wc -c < "$path") bytes)"
                code=$(curl -sS -o /tmp/out -w '%{http_code}' -X PUT \
                  -H "authorization: Bearer $KEY" \
                  -H "x-icon-source: $source" \
                  -H "x-icon-commit: $SHA" \
                  --data-binary "@$path" \
                  "$WORKER/manual/$address")
                ;;
              *)
                continue
                ;;
            esac

            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              # The worker's own words. It refuses for reasons a person can act on —
              # too large, not a raster image, not an address — so print what it said
              # rather than a status code on its own.
              echo "  refused with $code: $(cat /tmp/out)"
              fail=1
            fi
          done <<< "$changed"

          exit $fail
